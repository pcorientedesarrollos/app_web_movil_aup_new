<form [formGroup]="form" class="flex flex-col gap-5">

  <div>
    <label class="form-label">Control de plagas</label>
    <div class="flex flex-col gap-2 mt-1">
      @for (pest of pests; track pest) {
        <label (click)="toggle(pest)"
               class="flex items-center gap-3 p-3.5 rounded-xl border cursor-pointer transition-all"
               [class]="isChecked(pest) ? 'border-gold bg-gold/10' : 'border-cream-tan bg-cream-pure'">
          <div class="w-5 h-5 rounded border-2 flex items-center justify-center flex-shrink-0"
               [class]="isChecked(pest) ? 'border-gold bg-gold' : 'border-brown-muted/30'">
            @if (isChecked(pest)) {
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>
            }
          </div>
          <span class="text-sm text-brown leading-snug">{{ pest }}</span>
        </label>
      }
    </div>
  </div>

  <div>
    <label class="form-label">Control</label>
    <input type="text" formControlName="metodoControl"
           placeholder="Describe el método utilizado..." class="form-input">
  </div>

  <button type="button" (click)="store.nextStep()" class="btn-primary">Continuar</button>
  <button type="button" (click)="store.prevStep()" class="btn-secondary -mt-2">Atrás</button>
</form>
