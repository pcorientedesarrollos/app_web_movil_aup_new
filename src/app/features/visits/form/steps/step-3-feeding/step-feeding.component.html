<form [formGroup]="form" class="flex flex-col gap-5">

  <div>
    <label class="form-label">¿Qué se alimentó?</label>
    <input type="text" formControlName="tipoAlimento"
           placeholder="Ej. jarabe de azúcar, torta proteínica..." class="form-input">
  </div>

  <div>
    <label class="form-label">Cantidad (kg o litros)</label>
    <input type="number" formControlName="cantidadAlimento" min="0" step="0.1" class="form-input">
  </div>

  <div>
    <label class="form-label">Origen de la miel de alimentación</label>
    <div class="grid grid-cols-2 gap-3 mt-1">
      @for (opt of [{v:'PROPIA', l:'Propia'},{v:'EXTERNA', l:'Comprada'}]; track opt.v) {
        <label class="flex items-center gap-3 p-3.5 rounded-xl border cursor-pointer transition-all"
               [class]="form.get('origenMiel')!.value === opt.v
                 ? 'border-gold bg-gold/10' : 'border-cream-tan bg-cream-pure'">
          <input type="radio" formControlName="origenMiel" [value]="opt.v" class="hidden">
          <div class="w-4 h-4 rounded-full border-2 flex items-center justify-center"
               [class]="form.get('origenMiel')!.value === opt.v ? 'border-gold' : 'border-brown-muted/30'">
            @if (form.get('origenMiel')!.value === opt.v) {
              <div class="w-2 h-2 rounded-full bg-gold"></div>
            }
          </div>
          <span class="text-sm font-medium text-brown">{{ opt.l }}</span>
        </label>
      }
    </div>
    @if (form.get('origenMiel')!.value === 'EXTERNA') {
      <p class="mt-2 text-xs text-brown-muted bg-cream-tan rounded-lg px-3 py-2">
        Nota: Adjuntar documento del proveedor al inspector
      </p>
    }
  </div>

  <div>
    <label class="form-label">Marcos de reserva de miel en colmenas</label>
    <div class="grid grid-cols-2 gap-3 mt-1">
      @for (opt of [{v:'MAS_4', l:'+4 marcos'},{v:'MENOS_4', l:'−4 marcos'}]; track opt.v) {
        <label class="flex items-center gap-3 p-3.5 rounded-xl border cursor-pointer transition-all"
               [class]="form.get('marcosReserva')!.value === opt.v
                 ? 'border-gold bg-gold/10' : 'border-cream-tan bg-cream-pure'">
          <input type="radio" formControlName="marcosReserva" [value]="opt.v" class="hidden">
          <div class="w-4 h-4 rounded-full border-2 flex items-center justify-center"
               [class]="form.get('marcosReserva')!.value === opt.v ? 'border-gold' : 'border-brown-muted/30'">
            @if (form.get('marcosReserva')!.value === opt.v) {
              <div class="w-2 h-2 rounded-full bg-gold"></div>
            }
          </div>
          <span class="text-sm font-medium text-brown">{{ opt.l }}</span>
        </label>
      }
    </div>
  </div>

  <button type="button" (click)="store.nextStep()" class="btn-primary">Continuar</button>
  <button type="button" (click)="store.prevStep()" class="btn-secondary -mt-2">Atrás</button>
</form>
