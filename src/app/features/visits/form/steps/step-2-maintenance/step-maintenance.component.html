<form [formGroup]="form" class="flex flex-col gap-5">

  <div>
    <label class="form-label">Limpieza y mantenimiento de apiario</label>
    <div class="flex flex-col gap-2 mt-1">
      @for (opt of apiarioOpts; track opt) {
        <label (click)="toggle('mantenimientoApiario', opt)"
               class="flex items-center gap-3 p-3.5 rounded-xl border cursor-pointer transition-all"
               [class]="isChecked('mantenimientoApiario', opt)
                 ? 'border-gold bg-gold/10' : 'border-cream-tan bg-cream-pure'">
          <div class="w-5 h-5 rounded border-2 flex items-center justify-center flex-shrink-0"
               [class]="isChecked('mantenimientoApiario', opt) ? 'border-gold bg-gold' : 'border-brown-muted/30'">
            @if (isChecked('mantenimientoApiario', opt)) {
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>
            }
          </div>
          <span class="text-sm text-brown">{{ opt }}</span>
        </label>
      }
    </div>
  </div>

  <div>
    <label class="form-label">Limpieza y mantenimiento de equipo</label>
    <div class="grid grid-cols-2 gap-2 mt-1">
      @for (opt of equipoOpts; track opt) {
        <label (click)="toggle('mantenimientoEquipo', opt)"
               class="flex items-center gap-2 p-3 rounded-xl border cursor-pointer transition-all"
               [class]="isChecked('mantenimientoEquipo', opt)
                 ? 'border-gold bg-gold/10' : 'border-cream-tan bg-cream-pure'">
          <div class="w-4 h-4 rounded border-2 flex items-center justify-center flex-shrink-0"
               [class]="isChecked('mantenimientoEquipo', opt) ? 'border-gold bg-gold' : 'border-brown-muted/30'">
            @if (isChecked('mantenimientoEquipo', opt)) {
              <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>
            }
          </div>
          <span class="text-sm text-brown">{{ opt }}</span>
        </label>
      }
    </div>
    @if (showOtroDesc) {
      <div class="mt-3">
        <label class="form-label">Descripción</label>
        <input type="text" formControlName="mantenimientoOtroDesc"
               placeholder="Descripción..." class="form-input mt-1">
      </div>
    }
  </div>

  <button type="button" (click)="store.nextStep()" class="btn-primary">Continuar</button>
  <button type="button" (click)="store.prevStep()" class="btn-secondary -mt-2">Atrás</button>
</form>
