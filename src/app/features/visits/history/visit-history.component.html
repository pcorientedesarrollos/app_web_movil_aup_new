<div class="flex flex-col min-h-full bg-cream">

  <!-- Header -->
  <div class="bg-cream-pure px-5 pt-5 pb-4 border-b border-cream-tan">
    <h2 class="text-lg font-bold text-brown">Mis Apiarios</h2>
    <p class="text-sm text-brown-muted mt-0.5">Visitas registradas este año</p>
  </div>

  <!-- List -->
  <div class="flex-1 px-5 py-4 pb-24 flex flex-col gap-3">

    @if (loading()) {
      <div class="flex justify-center py-16">
        <div class="w-6 h-6 border-2 border-gold border-t-transparent rounded-full animate-spin"></div>
      </div>
    }

    @for (a of apiarios(); track a.id) {
      <div (click)="openApiario(a.id, a.nombre)"
           class="card flex flex-col gap-3 active:opacity-80 transition-opacity cursor-pointer">

        <!-- Top row -->
        <div class="flex items-center gap-3">
          <!-- Hive icon -->
          <div class="w-11 h-11 rounded-xl bg-gold/15 flex items-center justify-center flex-shrink-0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C09A50" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
          </div>

          <!-- Info -->
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-brown truncate">{{ a.nombre }}</p>
            <p class="text-xs text-brown-muted mt-0.5">{{ a.colmenas }} colmenas</p>
          </div>

          <!-- Counter + arrow -->
          <div class="flex items-center gap-2 flex-shrink-0">
            <span class="text-sm font-bold text-gold">{{ a.visitasAnio }}<span class="text-xs text-brown-muted font-normal">/24</span></span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A8916A" stroke-width="2">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </div>
        </div>

        <!-- Progress bar -->
        <div class="h-1.5 rounded-full bg-cream-tan overflow-hidden">
          <div class="h-full rounded-full bg-gold transition-all"
               [style.width.%]="progressPct(a.visitasAnio)"></div>
        </div>

        <p class="text-[10px] text-brown-muted">
          {{ a.visitasAnio }} de 24 visitas este año
        </p>
      </div>
    }

    @if (!loading() && apiarios().length === 0) {
      <div class="flex flex-col items-center justify-center py-16 text-center">
        <p class="text-sm text-brown-muted">No tienes apiarios registrados</p>
      </div>
    }
  </div>

  <div class="sticky bottom-0">
    <app-bottom-nav />
  </div>
</div>
