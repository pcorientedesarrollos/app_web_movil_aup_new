<div class="min-h-screen bg-brown flex flex-col items-center justify-center px-6">

  <!-- Logo -->
  <div class="mb-8 text-center">
    <img src="assets/images/logo-login.png" class="w-20 h-20 object-contain mx-auto mb-4" alt="Logo">
    <h1 class="text-2xl font-bold text-cream-pure">Acceso Administrativo</h1>
    <p class="text-sm text-cream-tan/70 mt-1">Panel de control AUP</p>
  </div>

  <!-- Card -->
  <div class="w-full max-w-sm bg-cream-pure rounded-2xl shadow-xl p-6">

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

      <!-- Username -->
      <div>
        <label class="block text-xs font-semibold text-brown-muted uppercase tracking-wide mb-1.5">
          Usuario
        </label>
        <input formControlName="username" type="text" autocomplete="username"
          placeholder="Nombre de usuario"
          class="w-full px-4 py-3 rounded-xl border border-cream-tan bg-cream text-brown text-sm
                 focus:outline-none focus:ring-2 focus:ring-brown/30 placeholder:text-brown-muted/40">
      </div>

      <!-- Password -->
      <div>
        <label class="block text-xs font-semibold text-brown-muted uppercase tracking-wide mb-1.5">
          Contraseña
        </label>
        <div class="relative">
          <input formControlName="password" [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password" placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl border border-cream-tan bg-cream text-brown text-sm
                   focus:outline-none focus:ring-2 focus:ring-brown/30 placeholder:text-brown-muted/40 pr-12">
          <button type="button" (click)="togglePassword()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-brown-muted/60 hover:text-brown p-1">
            @if (showPassword()) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Error -->
      @if (errorMsg()) {
        <div class="px-4 py-3 bg-error-bg rounded-xl">
          <p class="text-xs text-error font-medium">{{ errorMsg() }}</p>
        </div>
      }

      <!-- Submit -->
      <button type="submit" [disabled]="loading()"
        class="w-full py-3.5 bg-brown text-cream-pure font-bold text-sm rounded-xl
               transition-opacity active:opacity-80 disabled:opacity-50 mt-2">
        @if (loading()) {
          <span class="flex items-center justify-center gap-2">
            <svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4" stroke-dashoffset="10" stroke-linecap="round"/>
            </svg>
            Ingresando...
          </span>
        } @else {
          Ingresar
        }
      </button>

    </form>
  </div>

  <!-- Back to apicultor login -->
  <a routerLink="/login" class="mt-6 text-xs text-cream-tan/60 hover:text-cream-tan underline">
    Acceso para apicultores
  </a>

</div>
