<div class="min-h-screen bg-cream-pure flex flex-col">
  <!-- Background decoration -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-20 -right-20 w-72 h-72 rounded-full bg-gold/5"></div>
    <div class="absolute -bottom-10 -left-10 w-48 h-48 rounded-full bg-gold/8"></div>
  </div>

  <div class="relative flex-1 flex flex-col justify-between px-6 py-10">
    <!-- Logo section -->
    <div class="flex flex-col items-center pt-8">
      <div class="w-28 h-28 rounded-3xl bg-cream-tan flex items-center justify-center mb-6 shadow-card">
        <img src="assets/images/logo-login.png"
             alt="Oaxaca Miel"
             class="w-20 h-20 object-contain"
             onerror="this.style.display='none'">
      </div>
      <h1 class="text-2xl font-bold text-brown text-center leading-tight">
        Reporte de visitas<br>de apiario
      </h1>
      <p class="mt-3 text-sm text-brown-muted text-center leading-relaxed px-4">
        Acceso exclusivo para apicultores registrados en el programa Oaxaca Miel
      </p>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 mt-8">
      @if (errorMsg()) {
        <div class="px-4 py-3 rounded-xl bg-error-bg border border-error/20">
          <p class="text-error text-sm">{{ errorMsg() }}</p>
        </div>
      }

      <!-- Username -->
      <div>
        <label class="form-label">Número de apicultor</label>
        <input
          type="text"
          formControlName="username"
          placeholder="07-031-004"
          autocomplete="username"
          class="form-input font-mono tracking-wider"
          [class.border-error]="form.get('username')?.invalid && form.get('username')?.touched">
      </div>

      <!-- Password -->
      <div>
        <label class="form-label">Contraseña</label>
        <div class="relative">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
            class="form-input pr-12"
            [class.border-error]="form.get('password')?.invalid && form.get('password')?.touched">
          <button type="button" (click)="togglePassword()"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-brown-muted/60">
            @if (showPassword()) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" [disabled]="form.invalid || loading()" class="btn-primary mt-2">
        @if (loading()) {
          <span class="flex items-center justify-center gap-2">
            <svg class="animate-spin w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
              <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1"/>
            </svg>
            Iniciando sesión...
          </span>
        } @else {
          Iniciar sesión
        }
      </button>
    </form>

    <!-- Footer -->
    <div class="text-center mt-6">
      <p class="text-xs text-brown-muted/60 leading-relaxed">
        ¿Olvidaste tu contraseña? Contacta a tu<br>
        coordinador regional de Oaxaca Miel
      </p>
    </div>
  </div>
</div>
